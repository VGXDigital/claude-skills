name: Build skill zips

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip per skill
        run: |
          mkdir -p dist
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -r "../dist/${name}.zip" "$name" -x '.*')
          done

      - name: Publish zips to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest skill zips" \
              --notes "Auto-built desktop-app skill zips. Always reflects the current main branch."
          gh release upload latest dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
